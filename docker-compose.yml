services:
  # PostgreSQL - Primary Data Warehouse
  postgres:
    image: postgres:16-alpine
    container_name: analytics_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytics_db}
      POSTGRES_USER: ${POSTGRES_USER:-analytics_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analytics_pass123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analytics_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - analytics_network

  # Redis - Caching and Session Storage
  redis:
    image: redis:7-alpine
    container_name: analytics_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - analytics_network

  # ClickHouse - OLAP Analytics Database
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: analytics_clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics_olap}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_pass123}
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # Native
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - analytics_network

  # Apache Kafka - Real-time Streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: analytics_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - analytics_network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: analytics_kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - analytics_network

  # MinIO - S3-compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: analytics_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - analytics_network

  # Apache Airflow - Workflow Orchestration
  airflow-webserver:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.airflow
    container_name: analytics_airflow_webserver
    depends_on:
      - postgres
      - redis
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-analytics_user}:${POSTGRES_PASSWORD:-analytics_pass123}@postgres/${POSTGRES_DB:-analytics_db}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-your-secret-key}
    volumes:
      - ./backend/etl/airflow/dags:/opt/airflow/dags
      - ./backend/etl/airflow/logs:/opt/airflow/logs
      - ./backend/etl/airflow/plugins:/opt/airflow/plugins
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - analytics_network

  airflow-scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.airflow
    container_name: analytics_airflow_scheduler
    depends_on:
      - postgres
      - redis
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-analytics_user}:${POSTGRES_PASSWORD:-analytics_pass123}@postgres/${POSTGRES_DB:-analytics_db}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./backend/etl/airflow/dags:/opt/airflow/dags
      - ./backend/etl/airflow/logs:/opt/airflow/logs
      - ./backend/etl/airflow/plugins:/opt/airflow/plugins
    command: scheduler
    networks:
      - analytics_network

  # MLflow - ML Model Registry and Tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: analytics_mlflow
    depends_on:
      - postgres
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-analytics_user}:${POSTGRES_PASSWORD:-analytics_pass123}@postgres/${POSTGRES_DB:-analytics_db}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow-artifacts
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin123}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --backend-store-uri postgresql://${POSTGRES_USER:-analytics_user}:${POSTGRES_PASSWORD:-analytics_pass123}@postgres/${POSTGRES_DB:-analytics_db} --default-artifact-root s3://mlflow-artifacts
    networks:
      - analytics_network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: analytics_api
    depends_on:
      - postgres
      - redis
      - clickhouse
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-analytics_user}:${POSTGRES_PASSWORD:-analytics_pass123}@postgres/${POSTGRES_DB:-analytics_db}
      REDIS_HOST: redis
      CLICKHOUSE_HOST: clickhouse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./pyproject.toml:/app/pyproject.toml
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - analytics_network

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: analytics_frontend
    depends_on:
      - api
    environment:
      REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start
    networks:
      - analytics_network

  # Jupyter Lab - Data Science Notebooks
  jupyter:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.jupyter
    container_name: analytics_jupyter
    depends_on:
      - postgres
      - api
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-analytics123}
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./backend:/home/jovyan/backend
    networks:
      - analytics_network

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: analytics_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - analytics_network

  # Grafana - Monitoring Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: analytics_grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - analytics_network

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  analytics_network:
    driver: bridge
